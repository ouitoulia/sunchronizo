langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: taxonomy_common
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - taxonomy
migration_group: scuola_taxonomy
label: 'Voci di tassonomia comuni a tutti i gradi di istruzione'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/taxonomy/argomenti.json'
    - 'https://ouitoulia.github.io/krene/taxonomy/tipologia_documenti.json'
  item_selector: data
  fields:
    -
      name: type
      label: 'Il tipo di vocabolario'
      selector: type
    -
      name: tid
      label: 'ID del termine di tassonomia'
      selector: id
    -
      name: name
      label: 'Il nome della voce di tassonomia'
      selector: attributes/name
    -
      name: icon
      label: Icona
      selector: attributes/icon
    -
      name: element_type
      label: 'Tipo di elemento'
      selector: attributes/type
    -
      name: description
      label: 'La descrizione della voce di tassonomia'
      selector: attributes/description
    -
      name: weight
      label: 'Il peso della voce di tassonomia'
      selector: attributes/weight
    -
      name: parent_id
      label: 'Id del termine genitore della voce di tassonomia'
      selector: relationships/parent/data/id
    -
      name: copertina
      label: 'Immagine di copertina'
      selector: relationships/copertina/data/id
    -
      name: published
      label: 'Se la voce è pubblicata o meno'
      selector: attributes/published
  ids:
    tid:
      type: integer
process:
  tid: tid
  vid: type
  name: name
  field_icona:
    plugin: skip_on_empty
    source: icon
    method: process
  field_type:
    plugin: skip_on_empty
    source: element_type
    method: process
  parent_id:
    -
      plugin: skip_on_empty
      source: parent_id
      method: process
    -
      plugin: migration_lookup
      migration: taxonomy_common
  parent:
    plugin: default_value
    default_value: 0
    source: '@parent_id'
  weight:
    plugin: default_value
    source: weight
    default_value: 0
  description/value:
    -
      plugin: skip_on_empty
      source: description
      method: process
  description/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  field_copertina:
    plugin: skip_on_empty
    source: copertina
    method: process
  status:
    plugin: default_value
    source: published
    default_value: 1
destination:
  plugin: 'entity:taxonomy_term'
migration_dependencies: {  }
