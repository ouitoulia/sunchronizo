langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_paragraph_timeline
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_paragraph
  - demo_paragraph_timeline
migration_group: scuola_demo
label: 'Paragrafi per field timeline'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/paragraph_point_list.json'
  item_selector: data
  fields:
    -
      name: id
      label: 'ID del paragrafo'
      selector: id
    -
      name: type
      label: 'Il tipo di paragrafo'
      selector: type
    -
      name: point_list_item
      label: 'I paragrafi piano di studi item collegati'
      selector: relationships/point_list_item/data/paragraph
    -
      name: settings
      label: 'Il paragrafo con le impostazioni'
      selector: relationships/settings/data/paragraph
    -
      name: language
      label: 'La lingua del contenuto'
      selector: language
  ids:
    id:
      type: integer
process:
  id: id
  type: type
  _point_list_item:
    plugin: migration_lookup
    migration: demo_paragraph_point_list_item
    source: point_list_item
  field_point_list_item:
    plugin: sub_process
    source: '@_point_list_item'
    process:
      target_id: '0'
      target_revision_id: '1'
  _settings:
    plugin: migration_lookup
    migration: demo_paragraph_settings
    source: settings
  field_settings:
    plugin: sub_process
    source: '@_settings'
    process:
      target_id: '0'
      target_revision_id: '1'
  langcode:
    plugin: default_value
    source: language
    default_value: und
destination:
  plugin: 'entity_reference_revisions:paragraph'
migration_dependencies:
  required:
    - demo_taxonomy
    - demo_paragraph_point_list_item
    - demo_paragraph_settings
