langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_page
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_node
  - demo_page
migration_group: scuola_demo
label: 'Tipo di contenuto Pagina Singola'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/page.json'
  item_selector: data
  fields:
    -
      name: nid
      label: 'ID del nodo'
      selector: id
    -
      name: type
      label: 'Il tipo di contenuto'
      selector: type
    -
      name: title
      label: 'Il titolo del contenuto'
      selector: attributes/titolo
    -
      name: copertina
      label: 'Immagine di copertina'
      selector: relationships/copertina/data/id
    -
      name: abstract
      label: 'Descrizione breve'
      selector: attributes/abstract
    -
      name: body
      label: 'Descrizione estesa'
      selector: attributes/descrizione_estesa
    -
      name: extra_info
      label: 'Le sezioni della pagina'
      selector: relationships/extra_info/data/paragraph
    -
      name: tipologia_sezione
      label: 'Tipologia sezione'
      selector: attributes/tipologia_sezione
    -
      name: path
      label: 'Path alias'
      selector: attributes/path
    -
      name: language
      label: 'La lingua del contenuto'
      selector: attributes/language
    -
      name: promote
      label: 'Se il contenuto è promosso alla prima pagina'
      selector: attributes/promote
    -
      name: sticky
      label: 'Se il contenuto è in cima agli elenchi'
      selector: attributes/sticky
    -
      name: published
      label: 'Se il contenuto è pubblicato o meno'
      selector: attributes/published
  ids:
    nid:
      type: integer
process:
  nid: nid
  uid:
    plugin: default_value
    default_value: 1
  type: type
  title: title
  field_copertina: copertina
  field_abstract: abstract
  body/value:
    plugin: skip_on_empty
    source: body
    method: process
  body/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  _extra_info:
    plugin: migration_lookup
    migration: demo_paragraph_extra_info
    source: extra_info
  field_extra_info:
    plugin: sub_process
    source: '@_extra_info'
    process:
      target_id: '0'
      target_revision_id: '1'
  field_tipologia_sezione:
    plugin: skip_on_empty
    source: tipologia_sezione
    method: process
  path: path
  langcode:
    plugin: default_value
    source: language
    default_value: und
  promote:
    plugin: default_value
    source: promote
    default_value: 0
  sticky:
    plugin: default_value
    source: sticky
    default_value: 0
  status:
    plugin: default_value
    source: published
    default_value: 0
destination:
  plugin: 'entity:node'
  default_bundle: page
  translations: true
migration_dependencies:
  required:
    - demo_media
    - demo_paragraph_extra_info
