id: demo_paragraph_point_list_item
label: Paragrafo point list item
migration_group: scuola_demo
migration_tags:
  - json
  - scuola
  - demo
  - demo_paragraph
  - demo_paragraph_point_list_item

source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json

  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: 'application/json'

  # The data_parser normally limits the fields passed on to the source plugin
  # to fields configured to be used as part of the migration. To support more
  # dynamic migrations, the JSON data parser supports including the original
  # data for the current row. Simply include the 'include_raw_data' flag set
  # to `true` to enable this. This option is disabled by default to minimize
  # memory footprint for migrations that do not need this capability.
  # include_raw_data: false

  # Flags whether to track changes to incoming data. If TRUE, we will maintain
  # hashed source rows to determine whether incoming data has changed.
  # track_changes: false

  urls:
    - 'https://ouitoulia.github.io/krene/demo/paragraph_point_list_item.json'

  # An xpath-like selector corresponding to the items to be imported.
  item_selector: data

  fields:
    - name: id
      label: 'ID del paragrafo'
      selector: id
    - name: type
      label: 'Il tipo di paragrafo'
      selector: type

    # Campi
    - name: title
      label: "Il testo"
      selector: attributes/title
    - name: kicker
      label: "La data da visualizzare"
      selector: attributes/kicker
    - name: data_element
      label: "L'eventuale data-element"
      selector: attributes/data_element
    - name: variants
      label: "La variante colore"
      selector: attributes/variants

    # Footer
    - name: language
      label: 'La lingua del contenuto'
      selector: language

  ids:
    id:
      type: integer

process:
  id: id
  type: type

  # Campi
  field_title:
    plugin: skip_on_empty
    source: title
    method: process
  field_kicker:
    plugin: skip_on_empty
    source: kicker
    method: process
  field_data_element:
    plugin: skip_on_empty
    source: data_element
    method: process
  field_variants:
    plugin: skip_on_empty
    source: variants
    method: process

  # Footer
  langcode:
    plugin: default_value
    source: language
    default_value: "und"

destination:
  plugin: 'entity_reference_revisions:paragraph'
  default_bundle: point_list_item

migration_dependencies: { }

dependencies:
  enforced:
    module:
      - sunchronizo

