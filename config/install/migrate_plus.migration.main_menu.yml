langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: main_menu
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - menu
  - main_menu
migration_group: scuola_menu
label: 'Main menu'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/menu/main.json'
  item_selector: data
  fields:
    -
      name: id
      label: 'ID item del menu'
      selector: id
    -
      name: uuid
      label: 'UUID item del menu'
      selector: uuid
    -
      name: langcode
      label: 'La lingua della voce'
      selector: langcode
    -
      name: label
      label: 'La label'
      selector: attributes/label
    -
      name: description
      label: 'La label'
      selector: attributes/description
    -
      name: type
      label: 'Nome macchina del menu'
      selector: attributes/type
    -
      name: link_uri
      label: 'Il campo uri'
      selector: link/uri
    -
      name: link_title
      label: 'Attributo title del tag'
      selector: link/title
    -
      name: link_options
      label: 'Gli attributi del tag'
      selector: link/options
    -
      name: weight
      label: 'Peso posizione'
      selector: attributes/weight
    -
      name: expanded
      label: 'Se la voce deve essere espansa'
      selector: attributes/expanded
    -
      name: parent
      label: "L'eventuale voce genitore"
      selector: parent/uuid
  ids:
    id:
      type: integer
process:
  id: id
  bundle:
    -
      plugin: default_value
      default_value: menu_link_content
  uuid: uuid
  langcode: langcode
  enabled:
    -
      plugin: default_value
      default_value: 1
  title: label
  description:
    -
      plugin: skip_on_empty
      source: description
      method: process
  menu_name:
    -
      plugin: get
      source: type
  link/uri:
    -
      plugin: get
      source: link_uri
  link/title:
    -
      plugin: skip_on_empty
      source: link_title
      method: process
    -
      plugin: get
      source: link_title
  link/options:
    -
      plugin: skip_on_empty
      source: link_options
      method: process
    -
      plugin: get
      source: link_options
  external:
    plugin: default_value
    default_value: 0
  weight:
    -
      plugin: get
      source: weight
  expanded:
    -
      plugin: skip_on_empty
      source: expanded
      method: process
  parent:
    -
      plugin: skip_on_empty
      source: parent
      method: process
    -
      plugin: concat
      source:
        - '@bundle'
        - parent
      delimiter: ':'
  default_langcode:
    -
      plugin: default_value
      default_value: 1
destination:
  plugin: 'entity:menu_link_content'
migration_dependencies: {  }
