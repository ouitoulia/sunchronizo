langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_circolare
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_node
  - demo_circolare
migration_group: scuola_demo
label: 'Tipo di contenuto Circolare'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/circolare.json'
  item_selector: data
  fields:
    -
      name: nid
      label: 'ID del nodo'
      selector: id
    -
      name: type
      label: 'Il tipo di contenuto'
      selector: type
    -
      name: title
      label: 'Il titolo del libro'
      selector: attributes/titolo
    -
      name: numero_circolare
      label: 'Il numero della circolare'
      selector: attributes/numero_circolare
    -
      name: anno_scolastico
      label: 'Anno scolastico'
      selector: relationships/anno_scolastico/data/id
    -
      name: abstract
      label: 'Oggetto della circolare'
      selector: attributes/abstract
    -
      name: argomenti
      label: Argomenti
      selector: relationships/argomenti/data
    -
      name: destinatari
      label: 'Destinatari circolare'
      selector: relationships/destinatari/data
    -
      name: data_oblio
      label: 'Oblio documento'
      selector: attributes/data_oblio
    -
      name: document_url
      label: 'URL del documento'
      selector: relationships/document/data/url
    -
      name: document
      label: 'I metadata del documento'
      selector: relationships/document
    -
      name: link
      label: 'Riferimenti normativi'
      selector: attributes/link
    -
      name: eventi
      label: 'Eventi correlati'
      selector: relationships/eventi/data
    -
      name: testo_circolare
      label: 'Testo della circolare'
      selector: attributes/testo_circolare
    -
      name: persona_responsabile
      label: Autori
      selector: relationships/persona_responsabile/data
    -
      name: language
      label: 'La lingua del contenuto'
      selector: attributes/language
    -
      name: promote
      label: 'Se il contenuto è promosso alla prima pagina'
      selector: attributes/promote
    -
      name: sticky
      label: 'Se il contenuto è in cima agli elenchi'
      selector: attributes/sticky
    -
      name: published
      label: 'Se il contenuto è pubblicato o meno'
      selector: attributes/published
  ids:
    nid:
      type: integer
process:
  nid: nid
  uid:
    plugin: default_value
    default_value: 1
  type: type
  title: title
  field_numero_circolare: numero_circolare
  field_anno_scolastico:
    plugin: skip_on_empty
    source: anno_scolastico
    method: process
  field_abstract: abstract
  field_argomenti:
    -
      plugin: skip_on_empty
      source: argomenti
      method: process
    -
      plugin: sub_process
      source: argomenti
      process:
        target_id: id
  field_destinatari:
    -
      plugin: skip_on_empty
      source: destinatari
      method: process
    -
      plugin: sub_process
      source: destinatari
      process:
        target_id: id
  field_data_oblio:
    plugin: skip_on_empty
    source: data_oblio
    method: process
  field_allegati/target_id:
    plugin: file_import
    source: document_url
    destination: constants/documents_media_path
    uid: '@_file_uid'
    file_exists: replace
    skip_on_missing_source: true
    id_only: true
  field_allegati/description:
    plugin: skip_on_empty
    source: document/data/description
    method: process
  field_link:
    plugin: skip_on_empty
    source: link
    method: process
  field_eventi:
    -
      plugin: skip_on_empty
      source: eventi
      method: process
    -
      plugin: sub_process
      source: eventi
      process:
        target_id: id
  body/value:
    -
      plugin: skip_on_empty
      source: testo_circolare
      method: process
  body/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  field_persona_responsabile:
    -
      plugin: skip_on_empty
      source: persona_responsabile
      method: process
    -
      plugin: sub_process
      source: persona_responsabile
      process:
        target_id: id
  langcode:
    plugin: default_value
    source: language
    default_value: und
  promote:
    plugin: default_value
    source: promote
    default_value: 0
  sticky:
    plugin: default_value
    source: sticky
    default_value: 0
  status:
    plugin: default_value
    source: published
    default_value: 0
destination:
  plugin: 'entity:node'
  default_bundle: circolare
  translations: true
migration_dependencies:
  required:
    - demo_taxonomy
    - demo_persona
    - demo_evento
