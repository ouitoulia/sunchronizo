langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_paragraph_extra_info
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_paragraph
  - demo_paragraph_extra_info
migration_group: scuola_demo
label: 'Paragrafi per field extra_info'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/paragraph_content.json'
    - 'https://ouitoulia.github.io/krene/demo/paragraph_history_carousel.json'
    - 'https://ouitoulia.github.io/krene/demo/paragraph_section.json'
    - 'https://ouitoulia.github.io/krene/demo/paragraph_attachments.json'
  item_selector: data
  fields:
    -
      name: id
      label: 'ID del paragrafo'
      selector: id
    -
      name: type
      label: 'Il tipo di paragrafo'
      selector: type
    -
      name: title
      label: 'Il titolo'
      selector: attributes/title
    -
      name: title_tag
      label: "L'heading tag da usare"
      selector: attributes/title_tag
    -
      name: text
      label: 'Campo di testo'
      selector: attributes/text
    -
      name: settings
      label: 'Il paragrafo con le impostazioni'
      selector: relationships/settings/data/paragraph
    -
      name: file_managed
      label: 'File da media'
      selector: relationships/file_managed/data
    -
      name: history_carousel_item
      label: 'I paragrafi history item collegati'
      selector: relationships/history_carousel_item/data/paragraph
    -
      name: section_content
      label: 'Il contenuto della sezione'
      selector: attributes/section_content
    -
      name: language
      label: 'La lingua del contenuto'
      selector: language
  ids:
    id:
      type: integer
process:
  id: id
  type: type
  field_title:
    plugin: skip_on_empty
    source: title
    method: process
  field_title_tag:
    plugin: skip_on_empty
    source: title_tag
    method: process
  field_text/value:
    plugin: skip_on_empty
    source: text
    method: process
  field_text/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  _settings:
    plugin: migration_lookup
    migration: demo_paragraph_settings
    source: settings
  field_settings:
    plugin: sub_process
    source: '@_settings'
    process:
      target_id: '0'
      target_revision_id: '1'
  field_file_managed:
    -
      plugin: skip_on_empty
      source: file_managed
      method: process
    -
      plugin: sub_process
      source: file_managed
      process:
        target_id: id
  _history_carousel_item:
    plugin: migration_lookup
    migration: demo_paragraph_history_carousel_item
    source: history_carousel_item
  field_history_carousel_item:
    plugin: sub_process
    source: '@_history_carousel_item'
    process:
      target_id: '0'
      target_revision_id: '1'
  field_section_content:
    plugin: skip_on_empty
    source: section_content
    method: process
  langcode:
    plugin: default_value
    source: language
    default_value: und
destination:
  plugin: 'entity_reference_revisions:paragraph'
migration_dependencies:
  required:
    - demo_media
    - demo_paragraph_history_carousel_item
    - demo_paragraph_settings
