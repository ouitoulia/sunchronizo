langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_notizia
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_node
  - demo_notizia
migration_group: scuola_demo
label: 'Tipo di contenuto Evento'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/notizia.json'
  item_selector: data
  fields:
    -
      name: nid
      label: 'ID del nodo'
      selector: id
    -
      name: type
      label: 'Il tipo di contenuto'
      selector: type
    -
      name: title
      label: 'Il titolo del contenuto'
      selector: attributes/titolo
    -
      name: tipologia_notizia
      label: 'Tipologia notizia'
      selector: relationships/tipologia_notizia/data/id
    -
      name: abstract
      label: 'Descrizione breve'
      selector: attributes/abstract
    -
      name: argomenti
      label: Argomenti
      selector: relationships/argomenti/data
    -
      name: copertina
      label: 'Immagine di copertina'
      selector: relationships/copertina/data/id
    -
      name: corpo
      label: 'Corpo della notizia'
      selector: attributes/corpo
    -
      name: autori
      label: 'Gli autori della notizia'
      selector: relationships/autori/data
    -
      name: persone
      label: "Le persone che parteciperanno all'evento"
      selector: relationships/persone/data
    -
      name: luoghi
      label: 'I luoghi citati dalla notizia'
      selector: relationships/luoghi/data
    -
      name: eventi
      label: 'Gli eventi correlati'
      selector: relationships/eventi/data
    -
      name: language
      label: 'La lingua del contenuto'
      selector: attributes/language
    -
      name: promote
      label: 'Se il contenuto è promosso alla prima pagina'
      selector: attributes/promote
    -
      name: sticky
      label: 'Se il contenuto è in cima agli elenchi'
      selector: attributes/sticky
    -
      name: published
      label: 'Se il contenuto è pubblicato o meno'
      selector: attributes/published
  ids:
    nid:
      type: integer
process:
  nid: nid
  uid:
    plugin: default_value
    default_value: 1
  type: type
  title: title
  field_tipologia_notizia:
    plugin: skip_on_empty
    source: tipologia_notizia
    method: process
  field_abstract: abstract
  field_argomenti:
    -
      plugin: skip_on_empty
      source: argomenti
      method: process
    -
      plugin: sub_process
      source: argomenti
      process:
        target_id: id
  field_copertina:
    plugin: skip_on_empty
    source: copertina
    method: process
  body/value:
    plugin: skip_on_empty
    source: corpo
    method: process
  body/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  field_persone:
    -
      plugin: skip_on_empty
      source: persone
      method: process
    -
      plugin: sub_process
      source: persone
      process:
        target_id: id
  field_persona_responsabile:
    -
      plugin: skip_on_empty
      source: autori
      method: process
    -
      plugin: sub_process
      source: autori
      process:
        target_id: id
  field_luoghi:
    -
      plugin: skip_on_empty
      source: luoghi
      method: process
    -
      plugin: sub_process
      source: luoghi
      process:
        target_id: id
  field_eventi:
    -
      plugin: skip_on_empty
      source: eventi
      method: process
    -
      plugin: sub_process
      source: eventi
      process:
        target_id: id
  langcode:
    plugin: default_value
    source: language
    default_value: und
  promote:
    plugin: default_value
    source: promote
    default_value: 0
  sticky:
    plugin: default_value
    source: sticky
    default_value: 0
  status:
    plugin: default_value
    source: published
    default_value: 0
destination:
  plugin: 'entity:node'
  default_bundle: notizia
  translations: true
migration_dependencies:
  required:
    - demo_taxonomy
    - demo_media
    - demo_persona
    - demo_luogo
    - demo_evento
