langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_partner
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_node
  - demo_partner
migration_group: scuola_demo
label: 'Tipo di contenuto Partner'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/partner.json'
  item_selector: data
  fields:
    -
      name: nid
      label: 'ID del nodo'
      selector: id
    -
      name: type
      label: 'Il tipo di contenuto'
      selector: type
    -
      name: title
      label: 'Il titolo del contenuto'
      selector: attributes/nome
    -
      name: copertina
      label: 'Immagine di copertina'
      selector: relationships/copertina/data/id
    -
      name: abstract
      label: 'Descrizione breve'
      selector: attributes/abstract
    -
      name: body
      label: 'Descrizione estesa'
      selector: attributes/descrizione_estesa
    -
      name: email
      label: Email
      selector: attributes/email
    -
      name: telefono
      label: Telefono
      selector: attributes/telefono
    -
      name: indirizzo
      label: 'Indirizzo del luogo'
      selector: attributes/indirizzo
    -
      name: coordinate_geografiche
      label: 'Coordinate geografiche del luogo'
      selector: attributes/coordinate_geografiche
    -
      name: link
      label: 'Eventuali siti web del partner'
      selector: attributes/link
    -
      name: language
      label: 'La lingua del contenuto'
      selector: attributes/language
    -
      name: promote
      label: 'Se il contenuto è promosso alla prima pagina'
      selector: attributes/promote
    -
      name: sticky
      label: 'Se il contenuto è in cima agli elenchi'
      selector: attributes/sticky
    -
      name: published
      label: 'Se il contenuto è pubblicato o meno'
      selector: attributes/published
  ids:
    nid:
      type: integer
process:
  nid: nid
  uid:
    plugin: default_value
    default_value: 1
  type: type
  title: title
  field_copertina: copertina
  field_abstract: abstract
  body/value:
    plugin: skip_on_empty
    source: body
    method: process
  body/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  field_email: email
  field_telefono: telefono
  field_indirizzo:
    -
      plugin: skip_on_empty
      source: indirizzo
      method: process
    -
      plugin: sub_process
      source: indirizzo
      process:
        country_code: nazione
        administrative_area: provincia
        locality: comune
        postal_code: cap
        address_line1: indirizzo
  field_coordinate_geografiche:
    -
      plugin: skip_on_empty
      source: coordinate_geografiche
      method: process
    -
      plugin: sub_process
      source: coordinate_geografiche
      process:
        value: value
        geo_type: geo_type
        lat: lat
        lon: lon
        left: left
        top: top
        right: right
        bottom: bottom
        geohash: geohash
  field_link:
    plugin: skip_on_empty
    source: link
    method: process
  langcode:
    plugin: default_value
    source: language
    default_value: und
  promote:
    plugin: default_value
    source: promote
    default_value: 0
  sticky:
    plugin: default_value
    source: sticky
    default_value: 0
  status:
    plugin: default_value
    source: published
    default_value: 0
destination:
  plugin: 'entity:node'
  default_bundle: partner
  translations: true
migration_dependencies:
  required:
    - demo_taxonomy
    - demo_media
