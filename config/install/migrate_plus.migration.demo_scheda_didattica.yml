langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_scheda_didattica
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_node
  - demo_scheda_didattica
migration_group: scuola_demo
label: 'Tipo di contenuto Scheda didattica'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/scheda_didattica.json'
  item_selector: data
  fields:
    -
      name: nid
      label: 'ID del nodo'
      selector: id
    -
      name: type
      label: 'Il tipo di contenuto'
      selector: type
    -
      name: title
      label: 'Il titolo del contenuto'
      selector: attributes/titolo
    -
      name: grado_di_istruzione
      label: 'Il livello'
      selector: relationships/grado_di_istruzione/data/id
    -
      name: abstract
      label: 'Descrizione breve'
      selector: attributes/abstract
    -
      name: persona_responsabile
      label: Insegnanti
      selector: relationships/persona_responsabile/data
    -
      name: materie
      label: 'Le materie che insegna la persona'
      selector: relationships/materie/data
    -
      name: copertina
      label: 'Logo o immagine del percorso'
      selector: relationships/copertina/data/id
    -
      name: argomenti
      label: Argomenti
      selector: relationships/argomenti/data
    -
      name: obiettivi
      label: 'Obiettivi della scheda'
      selector: attributes/obiettivi
    -
      name: competenze
      label: Competenze
      selector: relationships/competenze/data
    -
      name: durata
      label: 'Tempo di apprendimento'
      selector: attributes/durata
    -
      name: libri_di_testo
      label: 'Orario delle lezioni'
      selector: relationships/libri_di_testo/data
    -
      name: descrizione_attivita
      label: 'Tempo di apprendimento'
      selector: attributes/descrizione_attivita
    -
      name: language
      label: 'La lingua del contenuto'
      selector: attributes/language
    -
      name: promote
      label: 'Se il contenuto è promosso alla prima pagina'
      selector: attributes/promote
    -
      name: sticky
      label: 'Se il contenuto è in cima agli elenchi'
      selector: attributes/sticky
    -
      name: published
      label: 'Se il contenuto è pubblicato o meno'
      selector: attributes/published
  ids:
    nid:
      type: integer
process:
  nid: nid
  uid:
    plugin: default_value
    default_value: 1
  type: type
  title: title
  field_grado_di_istruzione: grado_di_istruzione
  field_abstract: abstract
  field_persona_responsabile:
    -
      plugin: skip_on_empty
      source: persona_responsabile
      method: process
    -
      plugin: sub_process
      source: persona_responsabile
      process:
        target_id: id
  field_materie:
    -
      plugin: skip_on_empty
      source: materie
      method: process
    -
      plugin: sub_process
      source: materie
      process:
        target_id: id
  field_copertina:
    plugin: skip_on_empty
    source: copertina
    method: process
  field_argomenti:
    -
      plugin: skip_on_empty
      source: argomenti
      method: process
    -
      plugin: sub_process
      source: argomenti
      process:
        target_id: id
  field_obiettivi/value: obiettivi
  field_a_cosa_serve/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  field_competenze:
    -
      plugin: skip_on_empty
      source: competenze
      method: process
    -
      plugin: sub_process
      source: competenze
      process:
        target_id: id
  _calculate_duration:
    -
      plugin: duration_calculate_duration
      source: durata
  _calculate_seconds:
    -
      plugin: duration_calculate_seconds
      source: durata
  field_durata:
    -
      plugin: skip_on_empty
      source: durata
      method: process
    -
      plugin: sub_process
      source: durata
      process:
        duration: '@_calculate_duration'
        seconds: '@_calculate_seconds'
  field_libri_di_testo:
    -
      plugin: skip_on_empty
      source: libri_di_testo
      method: process
    -
      plugin: sub_process
      source: libri_di_testo
      process:
        target_id: id
  body/value: descrizione_attivita
  body/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  langcode:
    plugin: default_value
    source: language
    default_value: und
  promote:
    plugin: default_value
    source: promote
    default_value: 0
  sticky:
    plugin: default_value
    source: sticky
    default_value: 0
  status:
    plugin: default_value
    source: published
    default_value: 0
destination:
  plugin: 'entity:node'
  default_bundle: scheda_didattica
  translations: true
migration_dependencies:
  required:
    - demo_taxonomy
    - demo_media
    - demo_persona
