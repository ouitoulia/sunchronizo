langcode: it
status: true
dependencies:
  enforced:
    module:
      - sunchronizo
id: demo_progetto
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - scuola
  - demo
  - demo_node
  - demo_progetto
migration_group: scuola_demo
label: 'Tipo di contenuto Progetto'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://ouitoulia.github.io/krene/demo/progetto.json'
  item_selector: data
  fields:
    -
      name: nid
      label: 'ID del nodo'
      selector: id
    -
      name: type
      label: 'Il tipo di contenuto'
      selector: type
    -
      name: title
      label: 'Il titolo del contenuto'
      selector: attributes/titolo
    -
      name: tipologia_progetto
      label: 'Tipologia progetto'
      selector: relationships/tipologia_progetto/data/id
    -
      name: abstract
      label: 'Descrizione breve'
      selector: attributes/abstract
    -
      name: anno_scolastico
      label: 'Anno scolastico'
      selector: relationships/anno_scolastico/data/id
    -
      name: argomenti
      label: Argomenti
      selector: relationships/argomenti/data
    -
      name: copertina
      label: 'Immagine di copertina'
      selector: relationships/copertina/data/id
    -
      name: stato_progetto
      label: 'Stato del progetto'
      selector: relationships/stato_progetto/data/id
    -
      name: data_ora_inizio
      label: "La data e l'ora di inizio"
      selector: attributes/data_ora_inizio
    -
      name: data_ora_fine
      label: "La data e l'ora di fine"
      selector: attributes/data_ora_fine
    -
      name: descrizione_estesa
      label: 'La descrizione estesa'
      selector: attributes/descrizione_estesa
    -
      name: obiettivi
      label: 'Obiettivi del progetto'
      selector: attributes/obiettivi
    -
      name: competenze
      label: Competenze
      selector: relationships/competenze/data
    -
      name: luoghi
      label: 'I luoghi in cui viene erogato il progetto'
      selector: relationships/luoghi/data
    -
      name: servizio
      label: 'I servizi correlati al percorso di studio'
      selector: relationships/servizio/data
    -
      name: persona_responsabile
      label: 'Organizzato da'
      selector: relationships/persona_responsabile/data
    -
      name: collaborazioni
      label: 'Collaborazioni con altri enti, associazioni, ecc'
      selector: relationships/collaborazioni/data
    -
      name: finanziamenti
      label: 'Progetto finanziato con'
      selector: relationships/finanziamenti/data
    -
      name: language
      label: 'La lingua del contenuto'
      selector: attributes/language
    -
      name: promote
      label: 'Se il contenuto è promosso alla prima pagina'
      selector: attributes/promote
    -
      name: sticky
      label: 'Se il contenuto è in cima agli elenchi'
      selector: attributes/sticky
    -
      name: published
      label: 'Se il contenuto è pubblicato o meno'
      selector: attributes/published
  ids:
    nid:
      type: integer
process:
  nid: nid
  uid:
    plugin: default_value
    default_value: 1
  type: type
  title: title
  field_tipologia_progetto: tipologia_progetto
  field_abstract: abstract
  field_anno_scolastico: anno_scolastico
  field_argomenti:
    -
      plugin: skip_on_empty
      source: argomenti
      method: process
    -
      plugin: sub_process
      source: argomenti
      process:
        target_id: id
  field_copertina:
    plugin: skip_on_empty
    source: copertina
    method: process
  field_stato_progetto: stato_progetto
  field_data_inizio:
    plugin: skip_on_empty
    source: data_ora_inizio
    method: process
  field_data_fine:
    plugin: skip_on_empty
    source: data_ora_fine
    method: process
  body/value: descrizione_estesa
  field_obiettivi/value: obiettivi
  field_obiettivi/format:
    -
      plugin: default_value
      default_value: bootstrap_italia_2
  field_competenze:
    -
      plugin: skip_on_empty
      source: competenze
      method: process
    -
      plugin: sub_process
      source: competenze
      process:
        target_id: id
  field_luoghi:
    -
      plugin: skip_on_empty
      source: luoghi
      method: process
    -
      plugin: sub_process
      source: luoghi
      process:
        target_id: id
  field_servizio:
    -
      plugin: skip_on_empty
      source: servizio
      method: process
    -
      plugin: sub_process
      source: servizio
      process:
        target_id: id
  field_persona_responsabile:
    -
      plugin: skip_on_empty
      source: persona_responsabile
      method: process
    -
      plugin: sub_process
      source: persona_responsabile
      process:
        target_id: id
  field_collaborazioni:
    -
      plugin: skip_on_empty
      source: collaborazioni
      method: process
    -
      plugin: sub_process
      source: collaborazioni
      process:
        target_id: id
  field_finanziamenti:
    -
      plugin: skip_on_empty
      source: finanziamenti
      method: process
    -
      plugin: sub_process
      source: finanziamenti
      process:
        target_id: id
  langcode:
    plugin: default_value
    source: language
    default_value: und
  promote:
    plugin: default_value
    source: promote
    default_value: 0
  sticky:
    plugin: default_value
    source: sticky
    default_value: 0
  status:
    plugin: default_value
    source: published
    default_value: 0
destination:
  plugin: 'entity:node'
  default_bundle: progetto
  translations: true
migration_dependencies:
  required:
    - demo_taxonomy
    - demo_media
    - demo_persona
    - demo_luoghi
    - demo_servizio
    - demo_partner
